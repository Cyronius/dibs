[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dibs"
version = "0.1.0"
description = "Call dibs on the GPU, NPU, network or test database, so parallel Claude Code sessions take turns instead of colliding."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cyrus Attoun" }]
keywords = ["locks", "gpu", "npu", "claude-code", "parallel-agents", "benchmarks"]

[project.optional-dependencies]
psutil = ["psutil>=5.9"]
test = ["pytest>=8"]

[project.scripts]
dibs = "dibs.cli:main"

[project.urls]
Homepage = "https://github.com/Cyronius/dibs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dibs*"]

[tool.pytest.ini_options]
testpaths = ["specs/dibs/tests"]
addopts = "-p no:cacheprovider"
