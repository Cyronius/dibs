name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: launcher (POSIX)
        if: runner.os != 'Windows'
        run: sh bin/dibs version && sh bin/dibs doctor
      - name: launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: bin\dibs.cmd version && bin\dibs.cmd doctor

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate .claude-plugin/plugin.json --strict
      - name: versions agree
        run: |
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          grep -q "^version = \"$v\"" pyproject.toml
          grep -q "__version__ = \"$v\"" src/dibs/__init__.py
